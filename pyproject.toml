[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastly-bulk-services"
version = "0.1.0"
description = "Bulk-create Fastly VCL services from an F5 Distributed Cloud inventory export"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
fastly-bulk = "fastly_bulk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
